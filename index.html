<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flatiron Task Lister</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="main-content">
    <h1 id="heading1">Task Lister Lite™️</h1>

    <form id="create-task-form" action="" method="POST">
      <label for="new-task-description"><span id="task-description">Task description:</span></label>
      <br>
      <input type="text" id="new-task-description" name="new-task-description" placeholder="Description" required>
      <br><br>
      <label id="nickname-label" for="name">Nickname:</label>
      <input id="nickname" name="name" type="text" required>
      <br><br>
      <label id="due-date-label" for="due-date">Due Date:</label>
      <input type="datetime-local" name="Due Date" id="due-date" required>
      <br><br>
      <input  id="button" type="submit" value="Create New Task">
    </form>

    <div id="list">
      <h2 id="heading2">My Todos:</h2>
      <ul id="tasks">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>

    <script src="./src/index.js"></script>
  </div>

</body>
</html>
